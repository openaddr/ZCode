name: pr-check
# DTS 流程外网验证的「流水线替身」:MR(PR)触发跑靶仓自带测试。
# 内网替换点:内部流水线对 MR 自动触发,本文件在内网靶仓中删除,mrStatus 适配器换 codehubcli。
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test src/
